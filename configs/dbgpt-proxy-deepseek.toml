[system]
# Load language from environment variable(It is set by the hook)
language = "${env:DBGPT_LANG:-zh}"
api_keys = []
encrypt_key = "your_secret_key"
# Kill-switch for AI Analyst Agent API routes (default: "true"). Set to "false" to disable mounting analyst_api.
# ANALYST_AGENT_ENABLED = "${env:ANALYST_AGENT_ENABLED:-true}"

# Server Configurations
[service.web]
host = "0.0.0.0"
port = 5670

[service.web.database]
type = "sqlite"
path = "pilot/meta_data/dbgpt.db"
[service.model.worker]
host = "127.0.0.1"

[rag.storage]
[rag.storage.vector]
type = "chroma"
persist_path = "pilot/data"

# Model Configurations
[models]
[[models.llms]]
name = "deepseek-v4-flash"
# name = "deepseek-v4-pro"
# name = "deepseek-reasoner"
# name = "deepseek-chat"
provider = "proxy/deepseek"
# Disable V4-Pro thinking mode so ReAct responses stay parseable.
thinking_enabled = false
api_key = "${env:DEEPSEEK_API_KEY}"

[[models.embeddings]]
name = "${env:EMBEDDING_MODEL_NAME:-text-embedding-3-small}"
provider = "${env:EMBEDDING_MODEL_PROVIDER:-proxy/openai}"
api_url = "${env:EMBEDDING_MODEL_API_URL:-https://api.openai.com/v1/embeddings}"
api_key = "${env:OPENAI_API_KEY:-sk-dummy}"

